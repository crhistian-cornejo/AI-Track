# Builds the installers for a tag (v*) and publishes the GitHub Release.
# Everything signing-related is optional: without the secrets the release is still
# produced, just unsigned (see docs/release-0.0.1.md). Manual runs: Actions > Release >
# Run workflow; they only publish when "publish" is ticked, otherwise they leave a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (default: v<workspace version>)"
        required: false
        type: string
      publish:
        description: "Publish the release (otherwise it stays a draft)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          ws_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -1)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ]; then tag="v${ws_version}"; fi
          version="${tag#v}"
          if [ "$version" != "$ws_version" ]; then
            echo "::error::tag $tag does not match the workspace version $ws_version"; exit 1
          fi
          publish=false
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.publish }}" = "true" ]; then publish=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  macos:
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import the Developer ID certificate
        if: env.APPLE_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package (universal)
        run: cargo xtask package --target mac --universal --sign
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            target/dist/AI-Track-*
            target/dist/platform-*.json
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Decode the code-signing certificate
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "WINDOWS_PFX_FILE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # NSIS is no longer on the runner image. Chocolatey's feed answers 503 now and then
      # (v0.0.7 lost a Windows build to it, and the step still went green because its last
      # command was the PATH update), so: retry, and fail here when makensis is not there.
      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          for ($i = 1; $i -le 5; $i++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$nsis\makensis.exe")) { break }
            Write-Host "NSIS install attempt $i of 5 failed (choco exit $LASTEXITCODE)"
            if ($i -lt 5) { Start-Sleep -Seconds (15 * $i) }
          }
          if (-not (Test-Path "$nsis\makensis.exe")) { throw 'makensis.exe is not there after 5 attempts to install NSIS' }
          # The runner ends a pwsh step with `exit $LASTEXITCODE`: choco's last code (3010, say) must not fail a good install.
          $global:LASTEXITCODE = 0
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Package
        run: cargo xtask package --target win --sign
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            target/dist/AI-Track-*
            target/dist/platform-*.json
          if-no-files-found: error

  publish:
    needs: [meta, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      # Two texts: notes.md goes into latest.json (the update dialog shows it as plain text, so
      # it has to be short) and release-body.md is the GitHub release page. With a written
      # docs/release-notes/<tag>.md the dialog gets that file and the page gets it plus the
      # commit list; without one both are the commit list. Version-bump commits ("0.0.8") are left out.
      - name: Release notes
        run: |
          git fetch --tags --force
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then ref="$GITHUB_SHA"; else ref="$TAG"; fi
          skip=(--extended-regexp --invert-grep --grep='^[0-9]+\.[0-9]+\.[0-9]+$')
          {
            if [ -n "$prev" ]; then git log --no-merges "${skip[@]}" --pretty='- %s (%h)' "${prev}..${ref}"; else git log --no-merges "${skip[@]}" --pretty='- %s (%h)' -n 50 "$ref"; fi
          } > "$RUNNER_TEMP/commits.md"
          written="docs/release-notes/${TAG}.md"
          if [ -f "$written" ]; then
            cp "$written" "$RUNNER_TEMP/notes.md"
            { cat "$written"; printf '\n\nCommits:\n\n'; cat "$RUNNER_TEMP/commits.md"; } > "$RUNNER_TEMP/release-body.md"
          else
            cp "$RUNNER_TEMP/commits.md" "$RUNNER_TEMP/notes.md"
            cp "$RUNNER_TEMP/commits.md" "$RUNNER_TEMP/release-body.md"
          fi
          cat "$RUNNER_TEMP/release-body.md"
      # The updater signatures (docs/updater.md) are made here, once, with the minisign tool:
      # the key is an unencrypted `minisign -G -W` key and only this job sees it.
      - name: Sign the updater artifacts
        if: env.UPDATER_PRIVATE_KEY != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/updater.key"
          umask 077
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$key"
          for f in target/dist/AI-Track-*.app.tar.gz target/dist/AI-Track-*setup.exe; do
            [ -f "$f" ] || continue
            minisign -S -s "$key" -m "$f" -t "AI-Track ${VERSION} $(basename "$f")"
          done
          rm -f "$key"
          minisign -V -p release/updater.pub -m target/dist/AI-Track-*.app.tar.gz
      - name: latest.json and SHA256SUMS.txt
        run: |
          cargo xtask package manifest --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md"
          ls -l target/dist
      # Everything the release needs, signed, kept with the run: if creating the
      # release fails, it can be published from here without rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.meta.outputs.tag }}
          path: |
            target/dist/AI-Track-*
            target/dist/latest.json
            target/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create the release
        run: |
          flags=()
          if [ "$PUBLISH" != "true" ]; then flags+=(--draft); fi
          # A tag with a suffix (v0.0.2-rc1) is a prerelease; those never become "latest".
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          # Debug symbols stay in the run's artifacts, not in the public release.
          files=($(ls target/dist/AI-Track-* | grep -v -- '-symbols\.') target/dist/SHA256SUMS.txt)
          if [ -f target/dist/latest.json ]; then files+=(target/dist/latest.json); fi
          gh release create "$TAG" "${files[@]}" "${flags[@]}" \
            --title "AI-Track ${VERSION}" --notes-file "$RUNNER_TEMP/release-body.md" \
            --target "$GITHUB_SHA" --repo "${{ github.repository }}"
