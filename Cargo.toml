[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/dsp",
  "crates/stock",
  "crates/engine",
  "crates/host",
  "crates/library",
  "crates/ai",
  "crates/mcp",
  "crates/splice",
  "crates/update",
  "crates/app",
  "xtask",
]
exclude = [
  "reference",
  "vendor/gpui-pre",
  "vendor/gpui-pre-apple",
  "vendor/gpui-pre-linux",
  "vendor/gpui-pre-macos",
  "vendor/gpui-pre-windows",
]

[workspace.package]
version = "0.0.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/crhistian-cornejo/AI-Track"
rust-version = "1.90"

[workspace.dependencies]
# Internal crates
aitrack-model = { path = "crates/model" }
aitrack-dsp = { path = "crates/dsp" }
aitrack-stock = { path = "crates/stock" }
aitrack-engine = { path = "crates/engine" }
aitrack-host = { path = "crates/host" }
aitrack-library = { path = "crates/library" }
aitrack-ai = { path = "crates/ai" }
aitrack-mcp = { path = "crates/mcp" }
aitrack-splice = { path = "crates/splice" }
aitrack-update = { path = "crates/update" }

# Shared third-party crates (pin here, use `.workspace = true` in members)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rtrb = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
# Secrets in the macOS Keychain / Windows Credential Manager (MIT OR Apache-2.0).
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Official MCP SDK (Apache-2.0). The 3.x series broke its API between minors: keep the pin exact.
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

# GPUI: Zed's framework, the same pinned + patched snapshot monoBOT uses.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# Release binaries. Debug info is not shipped inside the executables:
# `split-debuginfo = "packed"` puts it in a `.dSYM` (macOS) / `.pdb` (Windows) next to
# each binary, `cargo xtask package` archives those as `symbols-*` artifacts for
# symbolicating crash reports, and `debug = "line-tables-only"` keeps them small.
# (`strip = "debuginfo"` would also drop the .pdb on MSVC, so it is not used.)
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
panic = "unwind" # plugin hosts need unwinding to contain panics

# Fast iteration builds that still run DSP at a usable speed.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Avoids intermittent LNK1103 (corrupt debug info) when rebuilding the host crate on Windows.
[profile.dev.package.aitrack-host]
debug = "line-tables-only"

