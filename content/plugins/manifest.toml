# Free plugins catalog (docs/research/17-plugins-gratuitos-instalador.md).
#
# lane = "direct": the maker lets anyone download it from their own server. The app
#   downloads on request, only from allowed_hosts (redirects included), and installs
#   it when the sha256 matches. Until `cargo xtask plugins pin` fills sha256 and size
#   (it downloads each file once, on the maintainer's machine), the entry behaves as
#   a guided link: nothing is installed from an unpinned artifact.
# lane = "link": an account, the maker's manager, a form, or only an installer program.
#   The tab opens the official page and recognises the plugin once it is installed.
#
# Nothing here is ever mirrored on our servers. [V] URLs were read on the maker's page
# during the research; entries marked "check" in notes need the real file in hand.

[meta]
version = 1
updated = "2026-11-15"
notes = "Free plugins only. Pin hashes with `cargo xtask plugins pin`; verify them in CI with `cargo xtask plugins verify`."


