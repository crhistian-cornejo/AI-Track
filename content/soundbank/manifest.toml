# AI-Track sound bank manifest.
#
# [[pack]]  Bundled in the factory library. ONLY licenses that allow
#           redistribution inside another free product: CC0-1.0, CC-BY-3.0,
#           CC-BY-4.0 (with attribution). Each license was read from the
#           license file in the repository/archive or from the official page
#           (see `license_evidence`). `cargo xtask soundbank fetch` downloads,
#           verifies, extracts and indexes them into factory.db.
# [[hub]]   Content Hub: link-only. Free packs whose terms forbid
#           redistribution, packs that are too large to bundle, and free
#           plugins. The user downloads them from the official page and the
#           app indexes the download folder.
#
# sha256: archive hash. For format = "github_tree" it is the sha256 of the
# sorted "path<TAB>git-blob-sha" list of the selected files at the pinned
# commit (each file is also checked against its git blob sha1).

[meta]
version = 1
updated = "2026-11-11"
notes = "Target size: <= 1.5 GB on disk. Licenses verified 2026-11-11."

