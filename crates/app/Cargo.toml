[package]
name = "aitrack-app"
description = "AI-Track desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aitrack"
path = "src/main.rs"

[dependencies]
aitrack-model.workspace = true
aitrack-dsp.workspace = true
aitrack-engine.workspace = true
aitrack-stock.workspace = true
aitrack-host.workspace = true
aitrack-ai.workspace = true
# The external MCP server (agents outside the app) and its stdio shim binary.
aitrack-mcp.workspace = true
aitrack-library = { workspace = true, features = ["ai"] }
# Opt-in Splice search in the palette (Preferences → Sounds).
aitrack-splice.workspace = true
# In-app updater: manifest, verified download, install (docs/updater.md).
aitrack-update.workspace = true
rtrb.workspace = true
# Browser preview voice on the default output (Apache-2.0).
cpal = "0.18"
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
# Reads WAV headers of imported audio and stems (MIT OR Apache-2.0).
hound = "3.5"
# The manifest gives the window per-monitor DPI awareness on Windows.
gpui = { workspace = true, features = ["windows-manifest"] }
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
serde.workspace = true
serde_json.workspace = true
# Theme folder hot reload (CC0).
notify = "8.2"
async-channel = "2"
# Process CPU and memory for the status bar. MIT.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# Background images: decode, downscale and pre-blur once, off the UI thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The Bloom visual's shaders (MIT OR Apache-2.0): the wgpu the GPUI crates
# already pin, Metal on macOS and DX12 on Windows, created lazily off the UI thread.
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "wgsl"] }
# Waits for wgpu's adapter and device on the Bloom render thread (Apache-2.0 OR MIT OR Zlib).
pollster = "0.4"

# `AITRACK_DEV_HIDDEN`: moves the window out of sight for background visual checks (MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
# The Bloom visual renders into IOSurfaces that GPUI shows as surfaces, zero-copy (MIT OR Apache-2.0 OR Zlib).
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLAllocation", "MTLPixelFormat", "MTLTypes", "objc2-io-surface"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString", "CFNumber"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Real font shaping for the frame-time benchmark in `fps.rs` (tests only).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = "=0.3.9"

[lints]
workspace = true

# Icon and version info of aitrack.exe (MIT; the crate gpui already uses for its manifest).
# Only built on Windows.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
