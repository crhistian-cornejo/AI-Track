[package]
name = "aitrack-app"
description = "AI-Track desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aitrack"
path = "src/main.rs"

[dependencies]
aitrack-model.workspace = true
aitrack-dsp.workspace = true
aitrack-engine.workspace = true
aitrack-stock.workspace = true
aitrack-host.workspace = true
aitrack-ai.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
# Reads WAV headers of imported audio and stems (MIT OR Apache-2.0).
hound = "3.5"
# The manifest gives the window per-monitor DPI awareness on Windows.
gpui = { workspace = true, features = ["windows-manifest"] }
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
serde.workspace = true
serde_json.workspace = true
# Theme folder hot reload (CC0).
notify = "8.2"
async-channel = "2"
# Background images: decode, downscale and pre-blur once, off the UI thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
