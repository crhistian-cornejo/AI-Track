[package]
name = "aitrack-dsp"
description = "AI-Track DSP foundation: Processor trait, buffers, events, parameters and primitives."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# MIT OR Apache-2.0. Real FFT for the spectrum analyzer and wavetable mipmaps.
realfft = "3"
# MIT. Signalsmith Stretch 1.3.1 (C++ header library, built with `cc`; its
# bindings come from `bindgen`, which needs libclang at build time: Xcode on
# macOS, the LLVM that ships on the Windows runners). Renders the Complex and
# Complex Pro warp modes, off the audio thread.
signalsmith-stretch = { version = "=0.1.3", optional = true }

[features]
default = ["signalsmith"]
signalsmith = ["dep:signalsmith-stretch"]

[lints]
workspace = true
