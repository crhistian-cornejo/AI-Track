[package]
name = "aitrack-engine"
description = "Real-time audio engine: graph, transport, audio and MIDI I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Fall back to the built-in test synth / gain / latency nodes when the injected
# factory returns `None` (always on in this crate's own unit tests).
test-nodes = []
# ASIO on Windows through cpal/asio-sys. Disabled by default: the ASIO SDK must
# be used under Steinberg's free *proprietary* licence (never its GPLv3 option,
# which would force the whole DAW to GPL). Needs CPAL_ASIO_DIR and LLVM/Clang.
asio = ["cpal/asio"]

[dependencies]
aitrack-model.workspace = true
aitrack-dsp.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
libloading = "0.8"
crossbeam-channel.workspace = true
rtrb.workspace = true
cpal = "0.18"
midir = "0.11"
hound = "3.5"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4", "alac", "adpcm", "aiff"] }
# Physical core count for the default number of DSP threads.
num_cpus = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# `thread_policy_set` (time-constraint policy for the DSP workers).
libc = "0.2"
# The device's IO workgroup the DSP workers join (the features cpal already
# enables, so nothing new is built).
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }

[[example]]
name = "play_demo"

[dev-dependencies]
serde_json.workspace = true
# The real MIDI effects, to run them through the real engine (tests only).
aitrack-stock.workspace = true

[lints]
workspace = true
