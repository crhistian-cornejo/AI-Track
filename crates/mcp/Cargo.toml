[package]
name = "aitrack-mcp"
description = "External MCP server: agents outside the app read and edit the open project; plus the stdio shim."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aitrack-mcp"
path = "src/bin/aitrack-mcp.rs"

[dependencies]
aitrack-model.workspace = true
# The tool definitions and their execution on a draft are shared with the in-app assistant.
aitrack-ai.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
# The server runs on its own runtime thread (MIT).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# Per-install bearer token from the OS random source (MIT OR Apache-2.0).
getrandom = "0.3"
# The stdio shim talks plain HTTP to 127.0.0.1 (no TLS needed).
ureq = { version = "3.5", default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[lints]
workspace = true
