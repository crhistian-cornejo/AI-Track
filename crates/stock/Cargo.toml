[package]
name = "aitrack-stock"
description = "Stock instruments and effects with factory presets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aitrack-dsp.workspace = true
serde.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0. Tiny WAV reader for the sampler / drum sampler state.
hound = "3.5"
# MIT. FFTs for the wavetable mip levels and the wavetable editor.
realfft = "3"

[dev-dependencies]
# Only to check that the scale tables of the MIDI devices match the model's.
aitrack-model.workspace = true

[lints]
workspace = true
