# cargo-deny policy: AI-Track is MIT, so no copyleft dependency may enter.
# Run: cargo deny check licenses
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0", # file-level copyleft only (symphonia); allowed
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
# Anything GPL/LGPL/AGPL is rejected by omission.

[bans]
multiple-versions = "allow"
deny = [
  { name = "vst3-sys", reason = "GPLv3 bindings; use the MIT `vst3` crate" },
  { name = "vst", reason = "VST2 is out of scope" },
]
