[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aitrack-library = { workspace = true, features = ["ai"] }
anyhow.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["platform-verifier"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "deflate", "ppmd", "util"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[lints]
workspace = true
